name: fortnote

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ALLOWED_ORIGIN: ${FORTNOTE_ALLOWED_ORIGIN:-http://localhost:3001}
      COOKIE_SECURE: ${FORTNOTE_COOKIE_SECURE:-false}
      DATABASE_CONNECTION_TIMEOUT_MS: ${FORTNOTE_DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_LOCK_TIMEOUT_MS: ${FORTNOTE_DATABASE_LOCK_TIMEOUT_MS:-5000}
      DATABASE_MAX_CONNECTIONS: ${FORTNOTE_DATABASE_MAX_CONNECTIONS:-10}
      DATABASE_PROVIDER: postgres
      DATABASE_STARTUP_RETRY_ATTEMPTS: ${FORTNOTE_DATABASE_STARTUP_RETRY_ATTEMPTS:-10}
      DATABASE_STARTUP_RETRY_DELAY_MS: ${FORTNOTE_DATABASE_STARTUP_RETRY_DELAY_MS:-1000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${FORTNOTE_DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_URL: ${FORTNOTE_DATABASE_URL:-postgresql://fortnote:fortnote-local@postgres:5432/fortnote}
      WEB_ROOT: /app/public
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${FORTNOTE_PORT:-3001}:3001"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: fortnote
      POSTGRES_USER: fortnote
      POSTGRES_PASSWORD: ${FORTNOTE_POSTGRES_PASSWORD:-fortnote-local}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${FORTNOTE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortnote -d fortnote"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
