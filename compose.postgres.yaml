name: fortnote

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fortnote
      POSTGRES_USER: fortnote
      POSTGRES_PASSWORD: ${FORTNOTE_POSTGRES_PASSWORD:-fortnote-local}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortnote -d fortnote"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
